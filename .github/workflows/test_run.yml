name: UI-tests

on:
  push            # расписать ручной запуск 

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
    - name: GitHub clone repository 
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Intsall Chrome
      run: sudo apt-get install google-chrome-stable
    - name: Install requirements
      run: pip install -r requirements.txt
    - name: Run tests
      run: pytest -s -v tests/test_basket.py --alluredir=allure-results
      continue-on-error: true 
    - name: Save allure results
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: allure-results

  generate-report:
    runs-on: ubuntu-latest
    needs: tests
    steps:
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: "microsoft"
        java-version: '17'
    - run: sudo wget https://github.com/allure-framework/allure2/releases/download/2.23.1/allure-2.23.1.tgz && sudo tar -zxvf allure-2.23.1.tgz -C /opt/ && sudo ln -s /opt/allure-2.23.1/bin/allure /usr/bin/allure
    - name: Dowlonload allure results
      uses: actions/download-artifact@v4
      with: 
        name: allure-results
    - run: allure generate -c allure-results -o allure-report

  publish-report:
    runs-on: ubuntu-latest
    needs: generate-report
    steps:
    - name: Dowlonload allure-report
      uses: actions/download-artifact@v4
      with:
        name: allure-report
    - uses: JamesIves/github-pages-deploy-action@4.1.5
      with:
        token: ${{ secrets.CI_TOKEN }}
        branch: gh-pages
        folder: allure-report
        clean: true 
      






  

